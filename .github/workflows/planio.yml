name: Planio Storage client

# Builds the Planio-branded client for Windows, macOS and Linux (AppImage).
# The theme lives in-tree at ./branding, which THEME.cmake picks up
# automatically.
#
# macOS packages are signed and notarized whenever the Developer ID secrets
# are available. Windows packages are signed with Azure Artifact Signing,
# which is metered, so that only happens for release tags: v<upstream
# version>-planio.<N>, e.g. v6.0.3-planio.1. Tag runs use the "release"
# environment, which holds the Azure OIDC secrets and is what the federated
# credential in Azure trusts.

on:
  push:
    branches:
      - 'planio/**'
    tags:
      - 'v*-planio.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  # Consumed by the owncloud-client craft blueprint when packaging, so it
  # finds the branded .desktop file / app bundle
  ApplicationExecutable: PlanioStorage
  ApplicationShortname: Planio Storage
  # Let AppImage tools self-extract when FUSE is unavailable (job containers)
  APPIMAGE_EXTRACT_AND_RUN: 1
  # Azure Artifact Signing account and certificate profile (North Europe)
  AZURE_SIGNING_ENDPOINT: https://neu.codesigning.azure.net
  AZURE_SIGNING_ACCOUNT: PLANIO_SIGNING_ACCOUNT_NAME
  AZURE_SIGNING_CERTIFICATE_PROFILE: storageclient-release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-cl-x86_64
            target: windows-cl-msvc2022-x86_64
            # windows-latest no longer carries VS 2022, which the msvc2022
            # target needs (upstream pins this runner too)
            os: windows-2022
            container:
          - name: macos-clang-arm64
            target: macos-clang-arm64
            # macos-latest is migrating to macOS 26 (Xcode 26) whose SDK the
            # Qt 6.8.3-era toolchain predates; stay on the Xcode 16 image
            os: macos-15
            container:
          - name: macos-clang-x86_64
            target: macos-64-clang
            # GitHub's last Intel image; x86_64 macOS runners end in Aug 2027
            os: macos-15-intel
            container:
          - name: linux-gcc-x86_64
            target: linux-64-gcc
            os: ubuntu-latest
            container: owncloudci/appimage-build:sles15-amd64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # release tags deploy to the "release" environment (Azure OIDC secrets);
    # everything else runs in a plain "ci" environment with no secrets
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'ci' }}
    permissions:
      contents: read
      # mint the OIDC token for azure/login
      id-token: write

    env:
      CRAFT_TARGET: ${{ matrix.target }}
      SIGN_WINDOWS: ${{ matrix.name == 'windows-cl-x86_64' && startsWith(github.ref, 'refs/tags/') }}

    steps:
    - name: Check out client
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      if: matrix.name == 'windows-cl-x86_64'
      with:
        python-version: '3.12'

    - name: Restore cache
      uses: actions/cache@v6
      with:
        path: ~/cache
        key: ${{ runner.os }}-${{ matrix.target }}

    # must run before "Craft setup": CraftMaster resolves ${Env:...}
    # interpolations once during setup and bakes them into CraftSettings.ini
    - name: Set up code signing
      if: runner.os == 'macOS'
      env:
        MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
        MAC_APPLE_ID: ${{ secrets.MAC_APPLE_ID }}
      run: |
        if (-not $env:MAC_CERT_P12) {
            Write-Host "::warning::MAC_CERT_P12 secret not available - the macOS package will only be ad-hoc signed"
            exit 0
        }
        $p12 = "$env:HOME/planio-devid.p12"
        [IO.File]::WriteAllBytes($p12, [Convert]::FromBase64String($env:MAC_CERT_P12))
        Add-Content $env:GITHUB_ENV "SIGN_PACKAGE=True"
        Add-Content $env:GITHUB_ENV "MAC_CERTIFICATE_APPLICATION=$p12"
        Add-Content $env:GITHUB_ENV "MAC_APPLE_ID=$env:MAC_APPLE_ID"

    - name: Clone CraftMaster
      run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

    - name: Craft setup
      run: |
        New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

    - name: Craft unshelve
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

    - name: Patch blueprint (branded packaging)
      run: |
        git -C "$env:HOME/craft/CraftMaster/blueprints/craft-blueprints-owncloud" apply "${env:GITHUB_WORKSPACE}/.github/workflows/blueprint-branded-packaging.patch"

    - name: Patch craft (macOS signing fixes)
      if: runner.os == 'macOS'
      run: |
        git -C "$env:HOME/craft/CraftMaster/craft-clone" apply "${env:GITHUB_WORKSPACE}/.github/workflows/craft-adhoc-sign.patch"
        git -C "$env:HOME/craft/CraftMaster/craft-clone" apply "${env:GITHUB_WORKSPACE}/.github/workflows/craft-staple-notarization.patch"

    - name: Prepare
      run: |
        New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" owncloud/owncloud-client
        if ($IsWindows) {
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/nsis
        } elseif($IsLinux) {
            & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/linuxdeploy
        }

    - name: Install dependencies
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps owncloud/owncloud-client

    - name: Drop AGL fallback from cached Qt (framework gone from modern macOS SDKs)
      if: runner.os == 'macOS'
      run: |
        $f = "$env:HOME/craft/CraftMaster/$env:CRAFT_TARGET/lib/cmake/Qt6/FindWrapOpenGL.cmake"
        $needle = 'set(__opengl_agl_fw_path "-framework AGL")'
        $c = Get-Content $f -Raw
        if (-not $c.Contains($needle)) { throw "AGL fallback not found in $f - cached Qt changed, drop this step?" }
        $c.Replace($needle, '# AGL fallback removed: the framework does not exist in modern macOS SDKs (fixed in newer Qt)') | Set-Content $f

    - name: Build
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache owncloud/owncloud-client

    - name: Run tests
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --test owncloud/owncloud-client

    # Signing is switched on only now, in the generated craft settings: with
    # CodeSigning enabled from the start, craft would also sign every binary
    # of every dependency it restores from its cache. The custom sign command
    # replaces craft's built-in signtool call for the packaged binaries, the
    # 7-Zip helper and the installer.
    - name: Set up Windows code signing
      if: env.SIGN_WINDOWS == 'true'
      run: |
        $tools = "${env:RUNNER_TEMP}/artifact-signing"
        nuget install Microsoft.Windows.SDK.BuildTools -ExcludeVersion -OutputDirectory $tools
        nuget install Microsoft.ArtifactSigning.Client -ExcludeVersion -OutputDirectory $tools
        $signtool = Get-ChildItem "$tools/Microsoft.Windows.SDK.BuildTools/bin/*/x64/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
        $dlib = Get-ChildItem "$tools/Microsoft.ArtifactSigning.Client/bin/x64/Azure.CodeSigning.Dlib.dll"
        if (-not $signtool -or -not $dlib) { throw "signtool or the Artifact Signing dlib was not found under $tools" }
        $metadata = "$tools/metadata.json"
        @{
            Endpoint = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_CERTIFICATE_PROFILE
            CorrelationId = "$env:GITHUB_REPOSITORY/$env:GITHUB_RUN_ID"
            # azure/login below provides the Azure CLI credential; skip the rest
            ExcludeCredentials = @(
                "EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
                "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
                "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"
            )
        } | ConvertTo-Json | Set-Content $metadata
        Add-Content $env:GITHUB_ENV "WINDOWS_SIGNTOOL=$($signtool.FullName)"
        Add-Content $env:GITHUB_ENV "WINDOWS_SIGN_DLIB=$($dlib.FullName)"
        Add-Content $env:GITHUB_ENV "WINDOWS_SIGN_METADATA=$metadata"
        Add-Content $env:GITHUB_ENV "WINDOWS_SIGN_LOG=$tools/signed-files.log"

        $settings = "$env:HOME/craft/CraftMaster/$env:CRAFT_TARGET/etc/CraftSettings.ini"
        $script = "${env:GITHUB_WORKSPACE}/.github/workflows/sign-windows.ps1".Replace('\', '/')
        $enableSigning = @'
        import configparser, sys
        path, command = sys.argv[1:]
        settings = configparser.ConfigParser(interpolation=None)
        settings.optionxform = str
        settings.read(path, encoding="utf-8")
        settings["CodeSigning"]["Enabled"] = "True"
        # craft defaults SignCache to Enabled; with it on, binaries that come
        # from craft's cache (Qt, OpenSSL, ...) would be left unsigned
        settings["CodeSigning"]["SignCache"] = "False"
        settings["CodeSigning"]["WindowsCustomSignCommand"] = command
        with open(path, "w", encoding="utf-8") as out:
            settings.write(out)
        '@
        python -c $enableSigning $settings "pwsh -NoProfile -File $script %F"
        if ($LASTEXITCODE -ne 0) { throw "failed to enable code signing in $settings" }
        Get-Content $settings | Select-String -Pattern "^\[CodeSigning\]" -Context 0, 8

    # the Azure CLI token is short-lived, so log in right before packaging
    - name: Azure login for Artifact Signing
      if: env.SIGN_WINDOWS == 'true'
      uses: azure/login@v3
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Package
      env:
        # craft's CI password lookup expects the CRAFT_SECRET_ prefix; unlike
        # the settings above, these are read at runtime, not baked at setup
        CRAFT_SECRET_MAC_CERTIFICATE_APPLICATION_PASSWORD: ${{ secrets.MAC_CERTIFICATE_APPLICATION_PASSWORD }}
        CRAFT_SECRET_MAC_APP_PASSWORD: ${{ secrets.MAC_APP_PASSWORD }}
      run: |
        & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package owncloud/owncloud-client

    - name: Prepare artifacts
      run: |
        Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue

    - name: Verify macOS package signature
      if: env.SIGN_PACKAGE == 'True'
      run: |
        $dmg = Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/*.dmg" | Select-Object -First 1
        if (-not $dmg) { throw "no dmg found in binaries/" }
        $info = codesign -dvv $dmg.FullName 2>&1 | Out-String
        Write-Host $info
        if ($info -notmatch "Developer ID Application: Planio GmbH") {
            throw "dmg is not signed with the Planio Developer ID"
        }
        xcrun stapler validate $dmg.FullName
        if ($LASTEXITCODE -ne 0) { throw "notarization ticket is not stapled" }

    - name: Verify Windows package signatures
      if: env.SIGN_WINDOWS == 'true'
      run: |
        $signed = @(Get-Content $env:WINDOWS_SIGN_LOG)
        Write-Host "craft signed $($signed.Count) files"
        # the installer alone means the packaged binaries were skipped
        if ($signed.Count -lt 2) { throw "expected the packaged binaries and the installer to be signed" }
        $installers = @(Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/*.exe")
        if (-not $installers) { throw "no installer found in binaries/" }
        foreach ($installer in $installers) {
            $info = & $env:WINDOWS_SIGNTOOL verify /pa /v $installer.FullName 2>&1 | Out-String
            Write-Host $info
            if ($LASTEXITCODE -ne 0) { throw "$($installer.Name) has no valid signature" }
            if ($info -notmatch "Issued to: Planio GmbH") { throw "$($installer.Name) is not signed with the Planio certificate" }
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: planiostorage-${{ matrix.name }}
        path: ${{ github.workspace }}/binaries/*

    # craft buffers per-stage output and drops it unless the stage raises,
    # so the console log often lacks the real error; the log files have it
    - name: Upload craft logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: craft-logs-${{ matrix.name }}
        path: ~/craft/CraftMaster/logs/
